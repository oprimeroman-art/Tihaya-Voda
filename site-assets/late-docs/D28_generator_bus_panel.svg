<text x="654" y="270" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">ШИНА Б</text><text x="654" y="308" font-family="monospace" font-size="21" fill="#303a36">ПРЕДЕЛ: 5</text><text x="654" y="344" font-family="monospace" font-size="19" fill="#303a36">Лаборатория 3 + радио 2</text><rect x="654" y="370" width="400" height="46" fill="#8b9785" stroke="#4b5b4d" stroke-width="3"/><rect x="654" y="370" width="400" height="46" fill="#b0b991"/><path d="M734 370V416 M814 370V416 M894 370V416 M974 370V416" stroke="#526250" stroke-width="3"/><text x="654" y="460" font-family="monospace" font-size="16" fill="#56615a">ЗАПАС: 0 / ПРЕДЕЛ ДОСТИГНУТ</text>
<rect x="128" y="500" width="926" height="102" fill="#303b38"/><text x="152" y="540" font-family="monospace" font-size="19" fill="#e0d8c2">ЕСЛИ СТРЕЛКИ НЕ СОГЛАСУЮТСЯ — ВЕРЬ АНАЛОГОВЫМ ПРИБОРАМ.</text><text x="152" y="574" font-family="monospace" font-size="18" fill="#c7c9b5">При ошибке отключи все переключатели и начни с нуля.</text><g fill="#d0b46e" stroke="#4d4938" stroke-width="4"><circle cx="145" cy="690" r="18"/><circle cx="215" cy="690" r="18"/><circle cx="285" cy="690" r="18"/></g><text x="330" y="698" font-family="monospace" font-size="18" fill="#d4d5c5">ПЕРЕЗАПУСК ДОПУСТИМ · ГЕНЕРАТОР НЕ ПОВРЕЖДЁН</text></svg>