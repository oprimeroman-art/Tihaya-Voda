<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><linearGradient id="sheet" x2="1" y2="1"><stop stop-color="#e5dfcd"/><stop offset="1" stop-color="#b9b29d"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter></defs><rect width="1200" height="800" fill="#171d1f"/><rect x="170" y="72" width="850" height="670" fill="#000" opacity=".5" filter="url(#shadow)"/><g transform="rotate(-1.4 600 400)"><rect x="178" y="54" width="844" height="690" fill="url(#sheet)" stroke="#8c887a" stroke-width="3"/><path d="M230 120H968" stroke="#a6a18f" stroke-width="2"/><text x="232" y="105" font-family="monospace" font-size="19" fill="#5d6055">АРХИВ / НЕОТПРАВЛЕННЫЕ ЧЕРНОВИКИ</text><text x="232" y="162" font-family="Georgia,serif" font-size="30" font-style="italic" fill="#293d48">Петя,</text><g font-family="Georgia,serif" font-size="23" font-style="italic" fill="#33434a"><text x="232" y="218">Я понимаю, что тебе не нравится мой разговор</text><text x="232" y="254">об этой камере. Но я не собираюсь делать из</text><text x="232" y="290">каждого странного кадра мистику.</text><text x="232" y="350">Я вижу мужчину, которого не помню.</text><text x="232" y="386">На следующий день он есть в списке.</text><text x="232" y="422">Ещё на следующий — его нет.</text><text x="232" y="482">Можно было бы решить, что дело в усталости,</text><text x="232" y="518">только Сухов, ты видел эту же запись со мной.</text><text x="232" y="578">Скажи честно, ты когда последний раз</text><text x="232" y="614">разговаривал с тем, кто после нашего разговора</text><text x="232" y="650">не оставил следов в снегу?</text></g><path d="M235 680 C320 663 420 696 515 677" fill="none" stroke="#6c7470" stroke-width="2"/><text x="970" y="714" text-anchor="end" font-family="monospace" font-size="15" fill="#66695f">ЛИСТ 1 / 2 · ЧЕРНОВИК</text></g><rect x="858" y="590" width="230" height="118" fill="#202b2c" stroke="#66716a" stroke-width="3" transform="rotate(5 970 649)"/><rect x="880" y="610" width="188" height="76" fill="#141a1b" transform="rotate(5 974 648)"/><circle cx="920" cy="644" r="10" fill="#aeb8a1"/><path d="M942 664 L966 633 L987 654 L1008 625 L1045 668" fill="none" stroke="#9ca99b" stroke-width="3"/><text x="975" y="592" text-anchor="middle" font-family="monospace" font-size="13" fill="#d5d6c8" transform="rotate(5 975 592)">КАМЕРА / КАДР 08</text></svg>