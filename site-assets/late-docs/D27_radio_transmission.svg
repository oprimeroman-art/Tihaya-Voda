<text x="122" y="490" font-family="monospace" font-size="20" fill="#343a36">«Электронный журнал показывает одного.</text><text x="122" y="522" font-family="monospace" font-size="20" fill="#343a36">Старый бумажный — пятерых. Не открывайте створки</text><text x="122" y="554" font-family="monospace" font-size="20" fill="#343a36">на голос, пока не подтвердите физическую численность».</text>
