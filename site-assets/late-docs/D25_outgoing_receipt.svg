<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-label="Квитанция исходящей почты для Оли Суховой">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4e0ce"/><stop offset=".55" stop-color="#c8c5b2"/><stop offset="1" stop-color="#a8aa9c"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#343a39" stop-opacity=".38"/><stop offset=".12" stop-color="#fff" stop-opacity=".12"/><stop offset=".9" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#303533" stop-opacity=".3"/></linearGradient>
 <filter id="grain" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="25" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="lines" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 17.5H18" stroke="#465451" stroke-opacity=".08" stroke-width=".7"/></pattern>
</defs>
<rect width="720" height="960" fill="#202b30"/>
<path d="M53 37 L661 42 L674 921 L45 918 Z" fill="#000" opacity=".45" filter="url(#shadow)"/>
