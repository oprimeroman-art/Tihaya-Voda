<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-label="Сюжетный медицинский документ"><defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1d4b4"/><stop offset=".44" stop-color="#cbbd9c"/><stop offset="1" stop-color="#b2a17e"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#433d34" stop-opacity=".45"/><stop offset=".15" stop-color="#fff" stop-opacity=".04"/><stop offset=".86" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#302b27" stop-opacity=".36"/></linearGradient>
<filter id="grain" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence baseFrequency=".67" numOctaves="3" seed="14" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".19"/></feComponentTransfer></filter>
