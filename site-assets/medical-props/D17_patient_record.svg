<g fill="#393d38" font-family="Georgia, 'Times New Roman', serif">
<text x="97" y="119" font-size="17" letter-spacing="4">СТАНЦИОННЫЙ МЕДПУНКТ</text>
<path d="M95 132H635" stroke="#41473f" stroke-width="2"/>
<text x="95" y="181" font-size="39" font-weight="bold" letter-spacing="2">КАРТА ПАЦИЕНТА</text>
<text x="95" y="214" font-size="18" letter-spacing="2">ОБСЛЕДОВАНИЕ / БЕЗ ФАМИЛИИ</text>
<rect x="94" y="241" width="548" height="148" fill="none" stroke="#53584c" stroke-width="1.5"/>
<path d="M94 289H642M94 340H642M345 241V389" stroke="#53584c" stroke-width="1" opacity=".65"/>
<text x="111" y="272" font-size="18">Фамилия: <tspan font-size="24" font-style="italic">не указана</tspan></text>
<text x="363" y="272" font-size="17">Дата: <tspan font-style="italic">не установлена</tspan></text>
<text x="111" y="319" font-size="18">Сознание: ясное</text>
<text x="363" y="319" font-size="17">Ориентация: нарушена</text>
<text x="111" y="369" font-size="18">Интоксикация: нет</text>
<text x="363" y="369" font-size="17">Состояние: тревожное</text>
<text x="96" y="431" font-size="22" font-weight="bold" letter-spacing="2">НАБЛЮДЕНИЯ</text>
<path d="M95 445H640" stroke="#565749"/>
<text x="101" y="485" font-size="20">Названы три календарные даты.</text>
<text x="101" y="521" font-size="20">Две из них — будущие.</text>
<path d="M96 547Q260 540 622 548" stroke="#564d42" stroke-width="1" opacity=".45"/>
<text x="101" y="585" font-size="20">Пульс и почерк совпадают с картой</text>
<text x="101" y="620" font-size="20">пациента, погибшего два года назад.</text>
<path d="M95 659L639 659" stroke="#5c5748" stroke-width="1"/>
<text x="105" y="706" font-size="18" font-style="italic" fill="#642d2d">Сопоставление — при живом пациенте.</text>
<text x="105" y="739" font-size="18" font-style="italic" fill="#642d2d">Объяснения нет.</text>
<path d="M102 765q150 14 320 -5" stroke="#682f2c" stroke-width="3" opacity=".62" fill="none"/>
<text x="101" y="836" font-size="18">Фельдшер:</text>
<path d="M217 837Q240 814 263 840T332 835Q352 817 385 828" fill="none" stroke="#303d44" stroke-width="2.5" opacity=".8"/>
