name: One-time Studio runtime sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified runtime patch
        run: python3 codex-scripts/apply_studio_runtime_fixes.py
      - name: Commit the synchronized Studio runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/index.html
          git commit -m "Sync Studio runtime with player fixes"
          git push origin HEAD:main
