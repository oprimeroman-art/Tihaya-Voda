name: Verify published voice
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Continue an earned UI save from this workflow after test-only fixes; 0 starts fresh'
        type: number
        default: 0
  workflow_run:
    workflows: [Live illustrated demo]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: published-voice-qa
  cancel-in-progress: false
jobs:
  voice:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify an earned campaign can be continued without application changes
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id > 0
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RESUME_RUN" > "$RUNNER_TEMP/earned-run.json"
          source_sha="$(python3 - <<'PYCODE'
          import json,os,re
          r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'earned-run.json')))
          assert r['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert r['head_branch']=='main' and r['name']=='Verify published voice' and r['status']=='completed'
          assert re.fullmatch('[0-9a-f]{40}',r['head_sha'])
          print(r['head_sha'])
          PYCODE
          )"
          git fetch --no-tags --depth=1 origin "$source_sha"
          git show "$source_sha":.github/workflows/voice-publication-qa.yml > "$RUNNER_TEMP/earned-workflow.yml"
          if ! git diff --quiet "$source_sha" HEAD -- . ':(exclude)studio/verification/**' ':(exclude)docs/**' ':(exclude).github/workflows/voice-publication-qa.yml'; then
            echo 'Application files changed. Start a fresh QA run without resume_run_id.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id > 0
        with:
          name: Tihaya-Voda-published-voice-QA
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: reports
      - name: Validate the provenance of the unfinished UI playthrough
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id > 0
        env:
          QA_RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,os
          p=pathlib.Path('reports/campaign-browser')
          result=json.loads((p/'result.json').read_text())
          progress=json.loads((p/'progress.json').read_text())
          assert result.get('harness',False) is False and progress['actionCount']>0
          workflow=pathlib.Path(os.environ['RUNNER_TEMP'],'earned-workflow.yml').read_text()
          assert "CAMPAIGN_UI_HARNESS: '0'" in workflow
          assert 0<len(progress['completedRoutes'])<4 and set(progress['completedRoutes'])<=set('ABCD')
          for mode in progress['completedRoutes']:
              assert 'Ending '+mode+', illustration, credits and postcredits' in progress['checks']
              assert mode+': canonical ending voice actually playing' in progress['checks']
          for mode in set('ABCD')-set(progress['completedRoutes']):
              save=p/('latest-'+mode+'.json')
              if save.exists():assert json.loads(save.read_text())['kind']=='GAGARIN_PLAYER_SAVE'
          source=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'earned-run.json')))
          (p/'resume-source.json').write_text(json.dumps({'run':int(os.environ['QA_RESUME_RUN']),'head':source['head_sha']}))
          PYCODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify real audio output from the deployed public game
        env:
          VOICE_GAME_URL: https://oprimeroman-art.github.io/Tihaya-Voda/
        run: node studio/verification/voice-browser.test.cjs
      - name: Verify direct exits, doorway travel and compact pause
        env:
          CAMPAIGN_GAME_URL: https://oprimeroman-art.github.io/Tihaya-Voda/
        run: |
          node studio/verification/direct-navigation-browser.cjs
          DIRECT_NAV_FALLBACK=1 node studio/verification/direct-navigation-browser.cjs
      - name: Verify compact controls in the deployed game
        env:
          CAMPAIGN_GAME_URL: https://oprimeroman-art.github.io/Tihaya-Voda/
        run: node studio/verification/compact-interactions-browser.cjs
      - name: Follow player objectives and inspect equipment in the deployed game
        env:
          CAMPAIGN_GAME_URL: https://oprimeroman-art.github.io/Tihaya-Voda/
        run: node studio/verification/player-guidance-browser.cjs
      - name: Play all four routes in the actually deployed game
        env:
          CAMPAIGN_GAME_URL: https://oprimeroman-art.github.io/Tihaya-Voda/
          CAMPAIGN_UI_HARNESS: '0'
          CAMPAIGN_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id > 0 && '1' || '0' }}
          CAMPAIGN_RESUME_RUN: ${{ inputs.resume_run_id || '' }}
        run: node studio/verification/campaign-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tihaya-Voda-published-voice-QA
          path: |
            reports/direct-navigation-browser/
            reports/direct-navigation-fallback/
            reports/player-guidance-browser/
            reports/compact-interactions/
            reports/voice-browser/
            reports/campaign-browser/
          if-no-files-found: ignore
