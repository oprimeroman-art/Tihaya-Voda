name: Live illustrated demo

on:
  push:
    branches: [main]
    paths:
      - game/index.html
      - site-assets/illustrated/**
      - site-assets/alpha-wave2/**
      - codex-scripts/alpha_wave2.py
      - codex-scripts/build_pages_demo.py
      - .github/workflows/pages-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-illustrated-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct approved illustrated A, B, C and existing story
        run: python3 codex-scripts/build_pages_demo.py --output _site
      - name: Check public preview contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('_site/index.html').read_text()
          assert 'KITCHEN_QA_PREVIEW_BEGIN' not in s
          assert s.count('"mime":"image/webp"')>=5
          assert 'noindex,nofollow,noarchive' in s
          assert len(s.encode('utf-8'))>2_500_000
          print('PASS 5 illustrated rooms, no Blender, noindex')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
