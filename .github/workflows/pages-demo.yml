name: Live illustrated demo

on:
  push:
    branches: [main]
    paths:
      - game/index.html
      - studio/index.html
      - studio/verification/player-runtime-regressions.py
      - studio/source/adventure-ui.js
      - site-assets/illustrated/**
      - site-assets/alpha-wave2/**
      - site-assets/alpha-wave3/**
      - site-assets/story-props-wave2/**
      - site-assets/medical-props/**
      - site-assets/stockroom-props/**
      - site-assets/airlock-archive-props/**
      - site-assets/late-docs/**
      - codex-scripts/alpha_wave2.py
      - codex-scripts/alpha_wave3.py
      - codex-scripts/alpha_wave4_props.py
      - codex-scripts/alpha_wave5_medical.py
      - codex-scripts/alpha_wave6_stockroom.py
      - codex-scripts/test_wave6_stockroom.py
      - codex-scripts/test_wave5_medical.py
      - codex-scripts/alpha_wave7_puzzle_docs.py
      - codex-scripts/alpha_wave8_late_docs.py
      - codex-scripts/test_wave8_late_docs.py
      - codex-scripts/alpha_wave9_document_props.py
      - codex-scripts/test_wave9_document_props.py
      - codex-scripts/test_wave7_puzzle_docs.py
      - codex-scripts/build_pages_demo.py
      - .github/workflows/pages-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-illustrated-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared UI into standalone game and editor
        run: |
          python3 codex-scripts/sync_document_ui.py
          python3 codex-scripts/sync_standalone_document_art.py
      - name: Reconstruct illustrated chapters, props and existing story
        run: python3 codex-scripts/build_pages_demo.py --output _site
      - name: Check player runtime regressions
        run: python3 studio/verification/player-runtime-regressions.py
      - name: Check public preview contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('_site/index.html').read_text()
          assert 'KITCHEN_QA_PREVIEW_BEGIN' not in s
          assert s.count('"mime":"image/webp"')>=6
          assert 'noindex,nofollow,noarchive' in s
          assert len(s.encode('utf-8'))>2_500_000
          assert 'ga-art-figure' in s and 'ga-illustrated-haunt' in s
          assert 'data:image/webp;base64,' in s
          print('PASS six illustrated rooms, canonical prop art, narrative ghosts, no Blender')
          PY
      - name: Verify canonical medical props in built game
        run: python3 codex-scripts/test_wave5_medical.py
      - name: Verify canonical stockroom documents in built game
        run: python3 codex-scripts/test_wave6_stockroom.py
      - name: Verify canonical airlock and VHS documents in built game
        run: python3 codex-scripts/test_wave7_puzzle_docs.py
      - name: Verify late-chapter document art in built game
        run: python3 codex-scripts/test_wave8_late_docs.py
      - name: Verify D27-D29 document art and UI rendering
        run: python3 codex-scripts/test_wave9_document_props.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
