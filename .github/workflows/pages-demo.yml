name: Live illustrated demo

on:
  push:
    branches: [main]
    paths:
      - game/index.html
      - studio/index.html
      - studio/verification/player-runtime-regressions.py
      - studio/verification/publication-art.test.py
      - studio/verification/quiet-scene-art.test.py
      - studio/verification/quiet-staging.test.cjs
      - production/final-scene-art.json
      - 'production/navigation-anchors.json'
      - 'production/room-presentation.json'
      - 'production/player-guidance.json'
      - 'production/inspection-art.json'
      - 'game-project/assets/inspections/**'
      - 'codex-scripts/sync_player_guidance.py'
      - 'studio/verification/player-guidance.test.cjs'
      - production/panorama-staging.json
      - production/interaction-anchors.json
      - game-project/assets/final-rooms/**
      - codex-scripts/sync_final_scene_art.py
      - studio/source/game-runtime.html
      - studio/source/story-core.js
      - studio/source/adventure-ui.js
      - game-project/assets/variants/authored_*.webp
      - production/quiet-scene-art.json
      - codex-scripts/sync_quiet_scene_art.py
      - studio/source/voice-queue.js
      - game-project/audio/voice-alpha/**
      - codex-scripts/sync_voice_assets.py
      - site-assets/illustrated/**
      - site-assets/alpha-wave2/**
      - site-assets/alpha-wave3/**
      - site-assets/story-props-wave2/**
      - site-assets/medical-props/**
      - site-assets/stockroom-props/**
      - site-assets/airlock-archive-props/**
      - site-assets/late-docs/**
      - site-assets/kitchen-states/**
      - codex-scripts/alpha_wave2.py
      - codex-scripts/alpha_wave3.py
      - codex-scripts/alpha_wave4_props.py
      - codex-scripts/alpha_wave5_medical.py
      - codex-scripts/alpha_wave6_stockroom.py
      - codex-scripts/test_wave6_stockroom.py
      - codex-scripts/test_wave5_medical.py
      - codex-scripts/alpha_wave7_puzzle_docs.py
      - codex-scripts/alpha_wave8_late_docs.py
      - codex-scripts/test_wave8_late_docs.py
      - codex-scripts/alpha_wave9_document_props.py
      - codex-scripts/test_wave9_document_props.py
      - codex-scripts/alpha_wave10_kitchen_state.py
      - codex-scripts/generate_kitchen_ghost_art.py
      - codex-scripts/test_wave10_kitchen_state.py
      - codex-scripts/test_wave7_puzzle_docs.py
      - codex-scripts/web_assets.py
      - studio/verification/web-assets.test.py
      - studio/verification/final-panorama-art.test.py
      - codex-scripts/build_pages_demo.py
      - .github/workflows/pages-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-illustrated-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared UI into standalone game and editor
        run: |
          python3 codex-scripts/sync_embedded_engine.py
          python3 codex-scripts/sync_standalone_document_art.py
          python3 codex-scripts/sync_quiet_scene_art.py
          python3 codex-scripts/sync_voice_assets.py
          python3 codex-scripts/sync_final_scene_art.py
      - name: Reconstruct illustrated chapters, props and existing story
        run: python3 codex-scripts/build_pages_demo.py --output _site
      - name: Verify voice packaging and canonical mappings
        run: |
          python3 -m pip install --quiet pillow
          python3 studio/verification/quiet-scene-art.test.py
          python3 studio/verification/publication-art.test.py
          python3 studio/verification/final-panorama-art.test.py
          python3 studio/verification/web-assets.test.py
          node studio/verification/quiet-staging.test.cjs
          node studio/verification/player-guidance.test.cjs
          python3 studio/verification/voice-assets.test.py
          node studio/verification/voice-queue.test.cjs
          python3 codex-scripts/sync_voice_assets.py --check --pages
      - name: Check player runtime regressions
        run: python3 studio/verification/player-runtime-regressions.py
      - name: Check public preview contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('_site/index.html').read_text()
          assert 'KITCHEN_QA_PREVIEW_BEGIN' not in s
          assert s.count('"mime":"image/webp"')>=6
          assert 'noindex,nofollow,noarchive' in s
          import json
          manifest=json.loads(Path('_site/web-assets.json').read_text())
          assert len(s.encode('utf-8'))<2_500_000
          assert manifest['assetCount']>100 and manifest['assetBytes']>10_000_000
          assert 'web-assets/' in s and 'assetSource(' in s
          assert 'ga-document-art' in s and 'illustratedProps' in s
          assert Path('_site/web-assets').is_dir()
          print('PASS six illustrated rooms, canonical prop art, narrative ghosts, no Blender')
          PY
      - name: Verify canonical medical props in built game
        run: python3 codex-scripts/test_wave5_medical.py
      - name: Verify canonical stockroom documents in built game
        run: python3 codex-scripts/test_wave6_stockroom.py
      - name: Verify canonical airlock and VHS documents in built game
        run: python3 codex-scripts/test_wave7_puzzle_docs.py
      - name: Verify late-chapter document art in built game
        run: python3 codex-scripts/test_wave8_late_docs.py
      - name: Verify D27-D29 document art and UI rendering
        run: python3 codex-scripts/test_wave9_document_props.py
      - name: Verify the chapter-4 ghost-mirror panorama
        run: python3 codex-scripts/test_wave10_kitchen_state.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
