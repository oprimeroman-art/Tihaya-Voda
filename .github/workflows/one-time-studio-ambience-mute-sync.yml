name: One-time Studio ambience mute sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch Studio ambience modulation
        run: python3 codex-scripts/fix_studio_ambience_mute.py
      - name: Commit Studio source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/index.html
          git commit -m "Keep master mute absolute in Studio ambience"
          git push origin HEAD:main
