name: Synchronize adventure runtime

on:
  workflow_dispatch:
    inputs:
      assemble_only:
        description: 'Assemble game/editor and commit generated files without running test suites'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'production/final-scene-art.json'
      - 'production/navigation-anchors.json'
      - 'production/room-presentation.json'
      - 'production/player-guidance.json'
      - 'production/inspection-art.json'
      - 'game-project/assets/inspections/**'
      - 'codex-scripts/sync_player_guidance.py'
      - 'studio/verification/player-guidance.test.cjs'
      - 'production/panorama-staging.json'
      - 'production/interaction-anchors.json'
      - 'game-project/assets/final-rooms/**'
      - 'codex-scripts/sync_final_scene_art.py'
      - 'codex-scripts/package_editable_project.py'
      - 'studio/source/adventure-core.js'
      - 'studio/source/adventure-ui.js'
      - 'game-project/assets/variants/authored_*.webp'
      - 'production/quiet-scene-art.json'
      - 'codex-scripts/sync_quiet_scene_art.py'
      - 'studio/source/voice-queue.js'
      - 'game-project/audio/voice-alpha/**'
      - 'codex-scripts/sync_voice_assets.py'
      - 'studio/source/game-runtime.html'
      - 'studio/source/story-core.js'
      - 'studio/source/rules-core.js'
      - 'studio/source/i18n.js'
      - 'studio/content/TIHAYA_VODA/adventure.json'
      - 'game-project/project.json'
      - 'game-project/audio/spatial/*.ogg'
      - 'game-project/video/found_footage/*.mp4'
      - 'studio/verification/monitor-variant-art.test.py'
      - 'studio/verification/horror-visuals.test.cjs'
      - 'studio/verification/horror-gaze.test.cjs'
      - 'codex-scripts/sync_document_ui.py'
      - 'codex-scripts/sync_standalone_document_art.py'
      - 'site-assets/kitchen-states/**'
      - 'codex-scripts/alpha_wave10_kitchen_state.py'
      - 'codex-scripts/generate_kitchen_ghost_art.py'
      - 'codex-scripts/test_wave10_kitchen_state.py'
      - 'codex-scripts/sync_embedded_engine.py'
      - 'codex-scripts/audit_art_ready.py'
      - 'production/asset_manifest_q01_q03.json'
      - 'art/overlays/**'
      - 'codex-scripts/generate_existing_room_overlays.py'
      - 'codex-scripts/test_existing_room_overlays.py'
      - 'codex-scripts/generate_spatial_audio_pack.py'
      - 'studio/verification/spatial-audio-pack.test.py'
      - 'codex-scripts/generate_found_footage_pack.py'
      - 'studio/verification/found-footage-pack.test.py'
      - 'studio/verification/campaign-integrity.test.py'
      - 'codex-scripts/apply_existing_room_overlays.py'
      - 'codex-scripts/apply_panorama_state_overlays.py'
      - 'studio/verification/room-variant-art.test.py'
      - '.github/workflows/sync-adventure-runtime.yml'

permissions:
  contents: write

concurrency:
  group: sync-adventure-runtime
  cancel-in-progress: false

jobs:
  synchronize:
    if: ${{ !inputs.assemble_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Run story engine regression checks
        run: |
          node studio/verification/adventure-pending.test.cjs
          node studio/verification/adventure-saves.test.cjs
          node studio/verification/adventure-rooms.test.cjs
          node studio/verification/player-guidance.test.cjs
      - name: Report Q01-Q03 production art readiness
        run: python3 codex-scripts/audit_art_ready.py
      - name: Verify required existing-room overlays
        run: python3 codex-scripts/test_existing_room_overlays.py
      - name: Update existing offline game and editor without overwriting unrelated runtime fixes
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            changed="$(git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA")"
            if grep -Eq '^(studio/source/adventure-core[.]js$|studio/source/game-runtime[.]html$|studio/source/adventure-ui[.]js$|studio/source/voice-queue[.]js$|studio/source/story-core[.]js$|studio/source/rules-core[.]js$|studio/source/i18n[.]js$|codex-scripts/sync_embedded_engine[.]py$|studio/content/TIHAYA_VODA/adventure[.]json$|game-project/project[.]json$|game-project/audio/spatial/.*[.]ogg$|game-project/video/found_footage/.*[.]mp4$)' <<< $changed; then
              echo 'Core/runtime source changed; using full synchronizer.'
              python3 codex-scripts/sync_embedded_engine.py
              python3 codex-scripts/sync_embedded_engine.py --check
            else
              echo 'Only shared UI or supporting assets changed; preserving the rest of the shipped runtime.'
              python3 codex-scripts/sync_document_ui.py
            fi
          else
            python3 codex-scripts/sync_embedded_engine.py
            python3 codex-scripts/sync_embedded_engine.py --check
          fi
          python3 codex-scripts/sync_standalone_document_art.py
          python3 codex-scripts/sync_approved_room_art.py
          python3 codex-scripts/sync_campaign_art.py
          python3 codex-scripts/sync_voice_assets.py
          node studio/verification/quiet-staging.test.cjs
          python3 studio/verification/voice-assets.test.py
          node studio/verification/voice-queue.test.cjs
          python -m pip install --disable-pip-version-check numpy soundfile pillow
          python3 codex-scripts/apply_panorama_state_overlays.py
          python3 codex-scripts/sync_quiet_scene_art.py
          python3 codex-scripts/sync_final_scene_art.py
          python3 studio/verification/room-variant-art.test.py
          python3 studio/verification/monitor-variant-art.test.py
          node studio/verification/campaign-story-graph.test.cjs
          python3 codex-scripts/package_editable_project.py
          echo 'User supplies audio and video. Media generation is disabled.'
          python3 studio/verification/spatial-audio-pack.test.py
          video_validation_required=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            video_changed_paths="$(git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA")"
            if grep -Eq '^game-project/video/found_footage/.*[.]mp4$' <<< "$video_changed_paths"; then
              video_validation_required=true
            fi
          fi
          if [[ "$video_validation_required" == true ]]; then
            if ! command -v ffprobe >/dev/null 2>&1; then
              if ! timeout 120s sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15; then
                echo 'Package index refresh timed out; attempting installation with cached indexes.'
              fi
              timeout 240s sudo apt-get install -y ffmpeg
            fi
            python3 studio/verification/found-footage-pack.test.py
          else
            echo 'Skipping ffprobe/video validation because no video files changed; preserving existing media.'
          fi
          python3 studio/verification/campaign-integrity.test.py
          python3 codex-scripts/test_wave10_kitchen_state.py
          python3 studio/verification/standalone-html.test.py
          node studio/verification/horror-visuals.test.cjs
          node studio/verification/horror-cues.test.cjs
          node studio/verification/horror-gaze.test.cjs
      - name: Commit generated HTML changes to the selected branch
        run: |
          git add game/source-project.zip game-project/rooms/*/approved_illustrated.webp game-project/assets/approved-rooms/*.webp studio/index.html game/index.html game-editor/index.html game-project/project.json game-project/assets/variants/*.webp studio/content/TIHAYA_VODA/adventure.json studio/content/PRODUCTION/09_ASSET_SLOTS.tsv reports/MISSING_ASSETS.tsv reports/adventure.json
          if git diff --cached --quiet; then
            echo 'Game and editor HTML are up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: synchronize adventure engine in game and editor'
          git push origin "HEAD:$GITHUB_REF_NAME"

  assemble:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.assemble_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble existing engine, final graphics and editable source
        run: |
          python3 codex-scripts/sync_embedded_engine.py
          python3 codex-scripts/sync_final_scene_art.py
          python3 codex-scripts/package_editable_project.py
      - name: Commit assembled game and editor
        run: |
          git add game/source-project.zip game/index.html game-editor/index.html studio/index.html game-project/project.json studio/content/TIHAYA_VODA/adventure.json reports/adventure.json studio/content/PRODUCTION/09_ASSET_SLOTS.tsv reports/MISSING_ASSETS.tsv
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: assemble final illustrated campaign and editor'
          git push origin "HEAD:$GITHUB_REF_NAME"
