name: Render B_NORMAL spherical candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'production/geometry/B_NORMAL/render_kitchen360.py'
      - 'production/geometry/B_NORMAL/verify_kitchen.py'
      - 'production/geometry/B_NORMAL/fetch_cc0_materials.py'
      - 'production/geometry/B_NORMAL/update_kitchen_qa.py'
      - 'production/geometry/B_NORMAL/curved_geometry.py'
      - 'production/geometry/B_NORMAL/generate_hotspots.py'
      - 'production/geometry/B_NORMAL/verify_curved_hotspots.py'
      - 'production/geometry/B_NORMAL/audit_visibility.py'
      - 'codex-scripts/build_kitchen_preview.py'
      - 'studio/verification/kitchen-preview.test.cjs'
      - '.github/workflows/render-kitchen-360.yml'
permissions:
  contents: write
concurrency:
  group: render-b-normal-360
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Download and verify CC0 photogrammetry materials
        run: python production/geometry/B_NORMAL/fetch_cc0_materials.py
      - name: Verify geometry and fixed story anchors
        run: python production/geometry/B_NORMAL/verify_kitchen.py
      - name: Verify curved props and candidate 360 hotspot mapping
        run: python production/geometry/B_NORMAL/verify_curved_hotspots.py
      - name: Render B_NORMAL true 360 geometry
        run: python production/geometry/B_NORMAL/render_kitchen360.py --width 2048 --out art/candidates/B_B_NORMAL_360_geometry.webp
      - name: Validate dimension and seam
        run: |
          python -c 'from PIL import Image; import numpy as np; im=Image.open("art/candidates/B_B_NORMAL_360_geometry.webp").convert("RGB"); assert im.size==(2048,1024),im.size; a=np.asarray(im,dtype=np.float32); diff=float(np.abs(a[:,0]-a[:,-1]).mean()); print("seam_mae",diff); assert diff<5,diff'
      - name: Generate proposed quads without editing playable rooms
        run: python production/geometry/B_NORMAL/generate_hotspots.py
      - name: Check that all 11 story prop surfaces are actually visible
        run: python production/geometry/B_NORMAL/audit_visibility.py
      - name: Refresh current candidate QA
        run: python production/geometry/B_NORMAL/update_kitchen_qa.py
      - name: Embed candidate into existing game as opt-in QA (normal mode untouched)
        run: |
          python codex-scripts/build_kitchen_preview.py
          python codex-scripts/build_kitchen_preview.py --check
          node studio/verification/kitchen-preview.test.cjs
          python studio/verification/standalone-html.test.py
      - name: Commit candidate without additional copies
        run: |
          git add art/candidates/B_B_NORMAL_360_geometry.webp art/materials/cc0/*.jpg production/qa/B_NORMAL_geometry_v1.json production/qa/B_NORMAL_hotspots_candidate.json production/qa/B_NORMAL_visibility_v1.json game/index.html
          if git diff --cached --quiet; then
            echo 'Candidate is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(art): B_NORMAL 360 geometry candidate'
          git push origin HEAD:main
