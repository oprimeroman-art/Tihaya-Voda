   range.oninput=()=>{audioSettings[key]=Number(range.value);setAudio();saveSoundPreferences()};row.append(span,range);outer.append(row);
  }
  outer.append(node('div','Громкость управляет звуками и музыкой сюжетных сцен. Звучание браузер разрешает после первого клика.','small'));
  menuButton(outer,'Назад',()=>showSystem(sessionStarted?'pause':'home'),true);
 }
 outer.append(node('div','Esc — меню и пауза · F — фонарик · колесо — масштаб · Ctrl+S — сохранить прогресс · D — журнал правил','gs-footer'));
}
$('gs-load-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const data=validateSave(JSON.parse(await file.text()));await loadGameSave(data);saveGameLocal();note('Сохранение из файла загружено.');}catch(err){alert('Не удалось загрузить SAVE.json: '+err.message)}});
$('gs-quick').onclick=()=>{if(sessionStarted)showSystem('pause');else showSystem('home')};
loadSoundPreferences();setTimeout(setAudio,0);
window.addEventListener('beforeunload',()=>{if(sessionStarted)saveGameLocal()});

function tick(ts){const dt=Math.min(.15,(ts-frameLast)/1000);frameLast=ts;refreshMedia(ts);directorTick(dt);if(runtime&&sessionStarted&&!sessionPaused){if(ts-lastAutoSave>20000){lastAutoSave=ts;saveGameLocal();}let look=null,light=null;for(const o of current().objects){if(!o.visible)continue;const p=project(centroid(o));if(!p)continue;if(!look&&Math.hypot(p.x-innerWidth/2,p.y-innerHeight/2)<Math.min(innerWidth,innerHeight)*.1)look=o.id;if(!light&&torch&&Math.hypot(p.x-mx,p.y-my)<110)light=o.id;}if(!adventurePlayer?.engine.modal)runtime.tick(dt,look,light);}requestAnimationFrame(tick)}requestAnimationFrame(tick);boot();
</script></body></html>
