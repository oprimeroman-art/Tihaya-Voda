function storageRead(key){try{return localStorage.getItem(key)}catch(err){return null;}}

function readSaved(){try{const raw=storageRead(SAVE_KEY);return raw?validateSave(JSON.parse(raw)):null}catch(e){console.warn('Повреждено сохранение',e);return null}}
function validateAdventureSave(v){const d=game.story?.adventure;const object=x=>x&&typeof x==='object'&&!Array.isArray(x);if(!d)return;if(!object(v)||v.version!==1||v.project!==d.id||!d.rooms?.some(r=>r.id===v.room)||!object(v.flags)||!Array.isArray(v.done)||!Number.isInteger(v.chapter)||!Array.isArray(d.quests)||v.chapter<1||v.chapter>d.quests.length)throw Error('Несовместимое сохранение сценария');if(adventurePlayer?.engine?.normalize)adventurePlayer.engine.normalize(v);}function validateSave(v){if(!v||v.kind!=='GAGARIN_PLAYER_SAVE'||v.version!==2||v.fingerprint!==gameFingerprint||!v.roomId||!game.rooms.some(r=>r.id===v.roomId))throw Error('Это сохранение другой игры или неподдерживаемой версии.');if(game.story?.adventure){if(!v.adventure)throw Error('В сохранении отсутствует состояние сценария.');validateAdventureSave(v.adventure);}return v;}
function saveObject(){if(!sessionStarted||!runtime)throw Error('Сначала начни игру.');return {kind:'GAGARIN_PLAYER_SAVE',version:SYSTEM_VERSION,fingerprint:gameFingerprint,title:game.name,savedAt:new Date().toISOString(),roomId,yaw,pitch,fov,torch,

 rooms:game.rooms.map(r=>({id:r.id,vars:(r.vars||[]).map(v=>({key:v.key,value:v.value})),objects:(r.objects||[]).map(o=>({id:o.id,state:o.state,visible:o.visible}))})),

function saveGameLocal(){if(!sessionStarted||!sessionReady)return false;const saved=saveObject();if(adventurePlayer?.engine.state.ended&&adventurePlayer.engine.state.checkpoint){const cp=adventurePlayer.engine.state.checkpoint;saved.adventure=GagarinAdventure.copy(cp.state);saved.adventure.checkpoint=GagarinAdventure.copy(cp);saved.roomId=saved.adventure.room;}let ok=storageWrite(SAVE_KEY,JSON.stringify(saved));if(!ok){console.warn('Автосохранение может быть недоступно: используй переносимый SAVE.json.')}return ok;}

function saveProgress(manual=false){if(!sessionStarted){note('Сначала начни игру.');return;}const ok=saveGameLocal();if(manual){note(ok?'Прогресс сохранён в этом браузере.':'Хранилище браузера заблокировано — скачай SAVE.json.');if(sessionPaused)showSystem('pause');}}
function restoreMutable(snapshot){for(const entry of snapshot.globals||[]){const dest=game.globals.find(v=>v.key===entry.key);if(dest)dest.value=entry.value;}

  for(const o of r.objects||[]){const src=(data.objects||[]).find(x=>x.id===o.id);if(src){o.state=Math.max(0,Math.min((o.states||[]).length-1,Number(src.state)||0));o.visible=!!src.visible;}}cache.get(r.id)&&(cache.get(r.id).dirty=true);
 }}
function clearPanoramaCache(){for(const entry of cache.values()){try{if(entry?.texture&&gl)gl.deleteTexture(entry.texture);}catch(_){}try{entry?.bitmap?.close?.();}catch(_){}}cache.clear();}function resetGame(){horrorCueStop();horrorGazeActive=false;horrorGazeKey='';horrorGazeHold=0;if(adventurePlayer){adventurePlayer.endingShown=false;Object.assign(game.panoramas,adventureBasePanoramas);for(const key of Object.keys(adventureVariantsApplied))delete adventureVariantsApplied[key];for(const entry of cache.values()){if(entry.texture&&gl)gl.deleteTexture(entry.texture);entry.cv.width=0;entry.cv.height=0;}cache.clear();}adventurePlayer?.reset();directorStop();for(const c of mediaControllers.values()){c.video?.pause();c.audio?.pause();c.playing=false;}clearTimeout(saveDebounce);storyPlayer.stop();restoreMutable(initialGameState);runtime.fired={};runtime.visits={};runtime.progress={};runtime.elapsedRoom=0;

 $('toggle').textContent='Фонарик: '+(torch?'включён':'выключен');sessionStarted=true;closeSystem();switchRoom(roomId).then(()=>{runtime.enter(roomId);saveGameLocal()}).catch(e=>note(e.message));}
async function loadGameSave(data){validateSave(data);horrorCueStop();horrorGazeActive=false;horrorGazeKey='';horrorGazeHold=0;directorStop();for(const c of mediaControllers.values()){c.video?.pause();c.audio?.pause();c.playing=false;}clearTimeout(saveDebounce);validateSave(data);const savedRoom=data.adventure?.room&&game.rooms.some(r=>r.id===data.adventure.room)?data.adventure.room:data.roomId;roomId=savedRoom;game.current=savedRoom;runtime.current=savedRoom;if(adventurePlayer&&data.adventure)adventurePlayer.load(data.adventure);storyPlayer.stop();restoreMutable(data);adventureReflectState();runtime.fired={...(data.rules?.fired||{})};runtime.visits={...(data.rules?.visits||{})};runtime.progress={...(data.rules?.progress||{})};runtime.elapsedRoom=0;

function setAudio(){if(storyPlayer){storyPlayer.volume.value=String(audioSettings.master);storyPlayer.musicRatio=audioSettings.music/100;storyPlayer.adjustVolumes()}for(const c of mediaControllers.values()){if(c.audio)c.audio.volume=Math.max(0,Math.min(1,audioSettings.master/100));}}

function loadSoundPreferences(){try{const v=JSON.parse(storageRead(PREF_KEY)||'null');if(v){audioSettings.master=Math.max(0,Math.min(100,Number(v.master)||0));audioSettings.music=Math.max(0,Math.min(100,Number(v.music)||0));}}catch(_){}}
let stationAmbience=null,stationAmbienceRoom='';function startStationAmbience(){try{if(!stationAmbience){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),master=ctx.createGain(),low=ctx.createOscillator(),mid=ctx.createOscillator(),filter=ctx.createBiquadFilter(),noise=ctx.createBufferSource(),noiseFilter=ctx.createBiquadFilter(),noiseGain=ctx.createGain(),lfo=ctx.createOscillator(),lfoGain=ctx.createGain();master.gain.value=0;low.type='sine';low.frequency.value=49;mid.type='triangle';mid.frequency.value=73;filter.type='lowpass';filter.frequency.value=170;low.connect(filter);mid.connect(filter);filter.connect(master);const buffer=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),data=buffer.getChannelData(0);let seed=0x51A7;for(let i=0;i<data.length;i++){seed=(seed*1664525+1013904223)>>>0;data[i]=((seed/4294967296)*2-1)*.65;}noise.buffer=buffer;noise.loop=true;noiseFilter.type='lowpass';noiseFilter.frequency.value=260;noise.connect(noiseFilter);noiseFilter.connect(noiseGain);noiseGain.gain.value=.055;lfo.frequency.value=.075;lfoGain.gain.value=.018;lfo.connect(lfoGain);lfoGain.connect(noiseGain.gain);noiseGain.connect(master);master.connect(ctx.destination);low.start();mid.start();noise.start();lfo.start();stationAmbience={ctx,master,filter,noiseFilter,noiseGain,low,mid,noise};}const a=stationAmbience;if(a.ctx.state==='suspended')a.ctx.resume().catch(()=>{});const prefs=audioSettings?.master??55;a.master.gain.setTargetAtTime(prefs<=0?0:.11*(prefs/100),a.ctx.currentTime,.7);const id=roomId||'A';if(id!==stationAmbienceRoom){stationAmbienceRoom=id;const outside='KLMNOP'.includes(id),technical='DEF'.includes(id),archive='GHIJ'.includes(id);a.filter.frequency.setTargetAtTime(outside?360:technical?115:archive?210:170,a.ctx.currentTime,1.2);a.noiseFilter.frequency.setTargetAtTime(outside?620:technical?150:archive?330:260,a.ctx.currentTime,1.2);a.low.frequency.setTargetAtTime(outside?37:technical?53:49,a.ctx.currentTime,1.2);a.mid.freq
