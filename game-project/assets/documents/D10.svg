<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980"><rect width="1100" height="980" fill="#dcd7c8"/><rect x="26" y="26" width="1048" height="928" fill="none" stroke="#9a9588"/><path d="M66 136H1034" stroke="#5c696b"/><g font-family="monospace"><text x="78" y="92" font-size="24" fill="#596365">МАЯК-9 / АРХИВ / D10</text><text x="78" y="190" font-size="21" fill="#283035">«ЗАКРЫТИЕ КОНТУРА 0-4. Перед работой обесточить внешний привод; </text><text x="78" y="220" font-size="21" fill="#283035">убедиться в положении механического стопора; сверить показания </text><text x="78" y="250" font-size="21" fill="#283035">аналоговых стрелок. Цифровые индикаторы при расслоении считать </text><text x="78" y="280" font-size="21" fill="#283035">справочными, но не решающими.</text><text x="78" y="310" font-size="21" fill="#283035">Режим 1. ОСТАНОВКА — один наблюдатель, уничтожение непрерывности кадров,</text><text x="78" y="340" font-size="21" fill="#283035"> потеря личной идентификации.</text><text x="78" y="370" font-size="21" fill="#283035">Режим 2. СОВМЕСТНОЕ НАБЛЮДЕНИЕ — два подтверждённых присутствия; </text><text x="78" y="400" font-size="21" fill="#283035">локальный контур расширяется.</text><text x="78" y="430" font-size="21" fill="#283035">Режим 3. ПЕРЕДАЧА — первичный архив и независимый радионоситель; </text><text x="78" y="460" font-size="21" fill="#283035">информация уходит за пределы контуров.</text><text x="78" y="490" font-size="21" fill="#283035">Режим 4. ЛОКАЛЬНЫЙ ПЕРЕНОС — личная непрерывная запись вместо внешнего </text><text x="78" y="520" font-size="21" fill="#283035">питания; сохранение отдельной линии без гарантии замыкания.</text><text x="78" y="550" font-size="21" fill="#283035">ВЫБОР НЕ ОБРАТИМ ПОСЛЕ ПОДПИСИ».</text></g></svg>