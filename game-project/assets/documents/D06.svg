<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980"><rect width="1100" height="980" fill="#dcd7c8"/><rect x="26" y="26" width="1048" height="928" fill="none" stroke="#9a9588"/><path d="M66 136H1034" stroke="#5c696b"/><g font-family="monospace"><text x="78" y="92" font-size="24" fill="#596365">МАЯК-9 / АРХИВ / D06</text><text x="78" y="190" font-size="21" fill="#283035">«КЕРН P-17. СКВАЖИНА 0-4. Глубина 914 м. Получено 19.01.2026, 02:16.</text><text x="78" y="220" font-size="21" fill="#283035">Состояние: целый, температура внутри оболочки —1,6 °C. Примечание: </text><text x="78" y="250" font-size="21" fill="#283035">температура фиксировалась при отсутствии термопары. В шлифе обнаружен </text><text x="78" y="280" font-size="21" fill="#283035">повторяющийся рисунок промышленного напольного покрытия, материал </text><text x="78" y="310" font-size="21" fill="#283035">которого не мог находиться на указанной глубине.</text><text x="78" y="340" font-size="21" fill="#283035">Подпись исполнителя: ОПЕРАТОР-04.</text><text x="78" y="370" font-size="21" fill="#283035">Рукописная приписка на обороте: «Я ещё не видел этот образец. Кто </text><text x="78" y="400" font-size="21" fill="#283035">оставил мне мою же карточку?»».</text></g></svg>