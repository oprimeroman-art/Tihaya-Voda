<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980"><rect width="1100" height="980" fill="#dcd7c8"/><rect x="26" y="26" width="1048" height="928" fill="none" stroke="#9a9588"/><path d="M66 136H1034" stroke="#5c696b"/><g font-family="monospace"><text x="78" y="92" font-size="24" fill="#596365">МАЯК-9 / АРХИВ / D16</text><text x="78" y="190" font-size="21" fill="#283035">«Гречка на двоих: половина кружки крупы; полторы кружки воды; соль по </text><text x="78" y="220" font-size="21" fill="#283035">вкусу; выключить нагрев и не открывать крышку пять минут.</text><text x="78" y="250" font-size="21" fill="#283035">Ниже другой ручкой: «НАС ОДИН».</text><text x="78" y="280" font-size="21" fill="#283035">Ещё ниже: «Не принципиально. Просто не хочется ужинать одному»».</text></g></svg>