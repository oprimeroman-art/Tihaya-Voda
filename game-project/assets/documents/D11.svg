<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980"><rect width="1100" height="980" fill="#dcd7c8"/><rect x="26" y="26" width="1048" height="928" fill="none" stroke="#9a9588"/><path d="M66 136H1034" stroke="#5c696b"/><g font-family="monospace"><text x="78" y="92" font-size="24" fill="#596365">МАЯК-9 / АРХИВ / D11</text><text x="78" y="190" font-size="21" fill="#283035">«18.01.2026 — ОПЕРАТОР-04 — прибыл на вертолёте 02-Р.</text><text x="78" y="220" font-size="21" fill="#283035">18.01.2026 — ОПЕРАТОР-04 — отказ в посадке, сотрудник признан </text><text x="78" y="250" font-size="21" fill="#283035">отсутствующим.</text><text x="78" y="280" font-size="21" fill="#283035">18.01.2026 — ОПЕРАТОР-04 — эвакуирован 22.01.2026 после инцидента №17.</text><text x="78" y="310" font-size="21" fill="#283035">Комиссией заверены все три записи. Сведения о фамилии имеются в двух </text><text x="78" y="340" font-size="21" fill="#283035">взаимоисключающих папках. В публичной копии фамилия не приводится.</text><text x="78" y="370" font-size="21" fill="#283035">Карандаш на обороте: «Я помню автобус до аэропорта. Помню лестницу </text><text x="78" y="400" font-size="21" fill="#283035">вертолёта. Не помню, как сел в него»».</text></g></svg>