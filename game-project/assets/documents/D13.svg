<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980"><rect width="1100" height="980" fill="#dcd7c8"/><rect x="26" y="26" width="1048" height="928" fill="none" stroke="#9a9588"/><path d="M66 136H1034" stroke="#5c696b"/><g font-family="monospace"><text x="78" y="92" font-size="24" fill="#596365">МАЯК-9 / АРХИВ / D13</text><text x="78" y="190" font-size="21" fill="#283035">«ОЛЕ / ДЛЯ ДОМА</text><text x="78" y="220" font-size="21" fill="#283035">Снять до конца зимовки.</text><text x="78" y="250" font-size="21" fill="#283035">Не отправлять по новому цифровому каналу — опять обрежет звук.</text><text x="78" y="280" font-size="21" fill="#283035">Точка воспроизведения: обычная старая камера, вход VIDEO IN.</text><text x="78" y="310" font-size="21" fill="#283035">Если записи больше нет — сохрани хотя бы мой голос.</text><text x="78" y="340" font-size="21" fill="#283035">П.»</text></g></svg>